<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Maintenance</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .box{max-width:520px;text-align:center;background:#fff;padding:48px 32px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{font-size:22px;font-weight:600;margin-bottom:14px;color:#222}
  p{font-size:15px;line-height:1.6;color:#666}
  .icon{font-size:48px;margin-bottom:18px;opacity:.6}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">⚙️</div>
    <h1>Site under maintenance</h1>
    <p>This domain is currently undergoing scheduled maintenance.<br>Please try again later.</p>
  </div>
</body></html>
